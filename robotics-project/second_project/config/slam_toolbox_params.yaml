slam_toolbox:
  ros__parameters:

    use_sim_time: true

 
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    
    odom_frame: UGV_odom
    map_frame: map
    base_frame: UGV_base_link
    scan_topic: /scan

    mode: mapping
    use_map_saver: true

    
    resolution: 0.04
    map_update_interval: 2.5

    
    throttle_scans: 1
    min_laser_range: 0.1
    max_laser_range: 20.0

    
    minimum_travel_distance: 0.08
    minimum_travel_heading: 0.08

    
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 15.0

    
    do_loop_closing: true
    loop_search_maximum_distance: 4.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 2.5
    loop_match_minimum_response_coarse: 0.40
    loop_match_minimum_response_fine: 0.40

   
    use_scan_matching: true
    use_scan_barycenter: true
    link_match_minimum_response_fine: 0.2
    link_scan_maximum_distance: 1.2

    
    correlation_search_space_dimension: 0.4
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 6.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    
    distance_variance_penalty: 0.6
    angle_variance_penalty: 1.2
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

